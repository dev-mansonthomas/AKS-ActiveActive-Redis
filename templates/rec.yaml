apiVersion: app.redislabs.com/v1
kind: RedisEnterpriseCluster
metadata:
  name: {{REC_NAME}}
spec:
  # Add fields here
#  rackAwarenessNodeLabel: "topology.kubernetes.io/zone"
#  redisOnFlashSpec:
#    enabled: true
#    storageClassName: managed-premium
  ingressOrRouteSpec:
    apiFqdnUrl: api.{{REC_NAME}}.{{DNS_ZONE}}
    dbFqdnSuffix: -db.{{REC_NAME}}.{{DNS_ZONE}}
    ingressAnnotations:
      haproxy-ingress.github.io/ssl-passthrough: "true"
      kubernetes.io/ingress.class: haproxy
    method: ingress
  nodes: {{RE_NODES}}
  redisEnterpriseNodeResources:
    limits:
      cpu: {{RE_CPU}}
      memory: {{RE_MEMORY}}
    requests:
      cpu: {{RE_CPU}}
      memory: {{RE_MEMORY}}
